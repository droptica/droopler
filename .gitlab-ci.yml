variables:
  MYSQL_DATABASE: "db"
  MYSQL_USER: "db"
  MYSQL_PASSWORD: "db"
  MYSQL_ROOT_PASSWORD: "root"
  FF_NETWORK_PER_BUILD: "1"

stages:
  - prepare
  - test

# Etap przygotowania: instalujemy zależności i budujemy codeception
prepare:
  stage: prepare
  image: drupalci/php-8.3-ubuntu-apache:production
  script:
    - composer install
    - ./vendor/bin/codecept build
    - ./vendor/bin/drush status
  cache:
    key: ${CI_PROJECT_NAME}-composer
    paths:
      - vendor/
  artifacts:
    paths:
      - vendor/
      - tests/_support/_generated/
    expire_in: 1 hour

# Testy Acceptance (bez JS)
test_acceptance:
  stage: test
  needs: ["prepare"]
  image: drupalci/php-8.3-ubuntu-apache:production
  services:
    - name: drupalci/mariadb-10.6:production
      alias: db
  before_script:
    - php -S 0.0.0.0:80 -t web/ &
    - echo "127.0.0.1 web" >> /etc/hosts
    # opcjonalnie: import dumpa lub site-install jeśli potrzebne
  script:
    - ./vendor/bin/codecept run Acceptance
  artifacts:
    when: always
    paths:
      - tests/_output/
    expire_in: 1 week

# Testy Js_capable (z Selenium)
test_js_capable:
  stage: test
  needs: ["prepare"]
  image: drupalci/php-8.3-ubuntu-apache:production
  services:
    - name: drupalci/mariadb-10.6:production
      alias: db
    - name: selenium/standalone-chrome:latest
      alias: selenium-chrome
  before_script:
    - php -S 0.0.0.0:80 -t web/ &
    - HOST_IP=$(hostname -I | cut -d' ' -f1)
    - sed -i "s|http://web/|http://$HOST_IP/|g" tests/Js_capable.suite.yml
  script:
    - ./vendor/bin/codecept run Js_capable
  artifacts:
    when: always
    paths:
      - tests/_output/
    expire_in: 1 week
