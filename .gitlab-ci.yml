################
# GitLabCI template for Drupal projects.
#
# This template is designed to give any Contrib maintainer everything they need to test, without requiring modification.
# It is also designed to keep up to date with Core Development automatically through the use of include files that can be centrally maintained.
# As long as you include the project, ref and three files below, any future updates added by the Drupal Association will be used in your
# pipelines automatically. However, you can modify this template if you have additional needs for your project.
# The full documentation is on https://project.pages.drupalcode.org/gitlab_templates/
################

# Step 1, 2 & 3: CI Configuration with JS_capable and Acceptance tests
# Implementing a step-by-step approach to get tests working

stages:
  - build
  - setup
  - test

variables:
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.composer-cache"
  COMPOSER_MEMORY_LIMIT: -1
  COMPOSER_NO_INTERACTION: "1"
  _WEB_ROOT: "web"
  GIT_DEPTH: "1"
  GIT_STRATEGY: "fetch"
  SKIP_ESLINT: "1"
  SKIP_CSPELL: "1"
  SKIP_STYLELINT: "1"
  _SHOW_ENVIRONMENT_VARIABLES: "1"
  MYSQL_DATABASE: "db"
  MYSQL_ROOT_PASSWORD: "root"
  MYSQL_USER: "db"
  MYSQL_PASSWORD: "db"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .composer-cache/

build:
  stage: build
  image: drupalci/php-8.3-ubuntu-apache:production
  script:
    - apt-get update -yqq
    - apt-get install -yqq git unzip
    - composer install --no-progress --prefer-dist --optimize-autoloader --no-scripts
    - rm -rf vendor/codeception/visualception
    - composer dump-autoload --optimize
  artifacts:
    name: "${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}"
    paths:
      - vendor/
      - web/
      - recipes/
      - tests/
      - codeception.yml
      - drush/
      - config/
    expire_in: 1 hour

setup_js_capable:
  stage: setup
  image: drupalci/php-8.3-ubuntu-apache:production
  dependencies:
    - build
  script:
    - apt-get update -yqq
    - apt-get install -yqq default-mysql-client
    - echo "ServerName web" >> /etc/apache2/apache2.conf
    - a2enmod rewrite
    - cat > /etc/apache2/sites-available/000-default.conf << 'EOL'
      <VirtualHost *:80>
        ServerName web
        DocumentRoot /var/www/html/web
        <Directory /var/www/html/web>
          AllowOverride All
          Require all granted
        </Directory>
      </VirtualHost>
      EOL
    - ln -sf ${CI_PROJECT_DIR}/web /var/www/html/web
    - chown -R www-data:www-data ${CI_PROJECT_DIR}/web
    - service apache2 restart
  artifacts:
    paths:
      - vendor/
      - web/
      - recipes/
      - tests/
      - codeception.yml
    expire_in: 1 hour

js_capable_tests:
  stage: test
  image: drupalci/php-8.3-ubuntu-apache:production
  services:
    - name: drupalci/mariadb-10.6:production
      alias: db
    - name: selenium/standalone-chrome:latest
      alias: selenium-chrome
  dependencies:
    - setup_js_capable
  script:
    - echo "CREATE DATABASE IF NOT EXISTS db;" | mysql -h db -u root -p${MYSQL_ROOT_PASSWORD}
    - php vendor/bin/codecept run Js_capable --xml
  artifacts:
    when: always
    paths:
      - tests/_output/
    reports:
      junit: tests/_output/report.xml
    expire_in: 1 week

setup_acceptance:
  stage: setup
  image: drupalci/php-8.3-ubuntu-apache:production
  dependencies:
    - build
  script:
    - apt-get update -yqq
    - apt-get install -yqq default-mysql-client
    - echo "ServerName web" >> /etc/apache2/apache2.conf
    - a2enmod rewrite
    - cat > /etc/apache2/sites-available/000-default.conf << 'EOL'
      <VirtualHost *:80>
        ServerName web
        DocumentRoot /var/www/html/web
        <Directory /var/www/html/web>
          AllowOverride All
          Require all granted
        </Directory>
      </VirtualHost>
      EOL
    - ln -sf ${CI_PROJECT_DIR}/web /var/www/html/web
    - chown -R www-data:www-data ${CI_PROJECT_DIR}/web
    - service apache2 restart
  artifacts:
    paths:
      - vendor/
      - web/
      - recipes/
      - tests/
      - codeception.yml
    expire_in: 1 hour

acceptance_tests:
  stage: test
  image: drupalci/php-8.3-ubuntu-apache:production
  services:
    - name: drupalci/mariadb-10.6:production
      alias: db
  dependencies:
    - setup_acceptance
  script:
    - echo "CREATE DATABASE IF NOT EXISTS db;" | mysql -h db -u root -p${MYSQL_ROOT_PASSWORD}
    - php vendor/bin/codecept run Acceptance --xml
  artifacts:
    when: always
    paths:
      - tests/_output/
    reports:
      junit: tests/_output/report.xml
    expire_in: 1 week
