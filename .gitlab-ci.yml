variables:
  MYSQL_DATABASE: "drupal"
  MYSQL_USER: "drupal"
  MYSQL_PASSWORD: "drupal"
  MYSQL_ROOT_PASSWORD: "root"
  FF_NETWORK_PER_BUILD: "1"
  BUILD_DIR: "."  # Use current directory as build directory

stages:
  - prepare
  - install

create-project:
  stage: prepare
  image: drupalci/php-8.3-ubuntu-apache:production
  script:
    - composer install --no-progress --prefer-dist --optimize-autoloader
    # Set up Drupal environment for Codeception
    - mkdir -p /var/www/html
    - ln -sf ${CI_PROJECT_DIR} /var/www/html/
    - ln -sf ${CI_PROJECT_DIR}/web /var/www/html/web
    # Check if symlinks were created correctly
    - ls -la /var/www/html/
    - ls -la /var/www/html/web/ || echo "Web directory not found in /var/www/html/"
    # Check for autoload.php
    - find ${CI_PROJECT_DIR} -name "autoload.php"
  artifacts:
    paths:
      - vendor/
      - web/
      - tests/
      - codeception.yml
    expire_in: 1 hour

install_drupal:
  stage: install
  image: drupalci/php-8.3-ubuntu-apache:production
  services:
    - name: 'drupalci/mysql-8'
      alias: database
  variables:
    DB_URL: mysql://drupal:drupal@database/drupal
    SIMPLETEST_DB: mysql://drupal:drupal@database/drupal
    SIMPLETEST_BASE_URL: "http://web"
  needs:
    - job: create-project
      artifacts: true
  script:
    # Set up Drupal environment for Codeception
    - mkdir -p /var/www/html
    - ln -sf ${CI_PROJECT_DIR} /var/www/html/
    - ln -sf ${CI_PROJECT_DIR}/web /var/www/html/web
    # Start web server
    - php -S 0.0.0.0:80 -t web/ &
    - echo "127.0.0.1 web" >> /etc/hosts
    # Create database
    - mysql -h database -u drupal -pdrupal -e "CREATE DATABASE IF NOT EXISTS drupal;"
    # Install Drupal
    - ./vendor/bin/drush site:install droopler --db-url=mysql://drupal:drupal@database/drupal --account-name=admin --account-pass=admin --site-name="Droopler CI" -y || echo "Drush site install failed, but continuing"
    - ./vendor/bin/drush status
    # Run Codeception build
    - ./vendor/bin/codecept build
    # Check if DrupalBootstrap can find autoload.php
    - php -r "require '/var/www/html/web/autoload.php'; echo 'Autoload.php loaded successfully\n';" || echo "Failed to load autoload.php"
    # Run tests with debug output
    - ./vendor/bin/codecept run Acceptance --debug --xml || echo "Acceptance tests failed, but continuing"
  artifacts:
    when: always
    paths:
      - tests/_output/
      - web/sites/default/
    expire_in: 1 week
