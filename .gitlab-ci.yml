################
# GitLabCI template for Drupal projects.
#
# This template is designed to give any Contrib maintainer everything they need to test, without requiring modification.
# It is also designed to keep up to date with Core Development automatically through the use of include files that can be centrally maintained.
# As long as you include the project, ref and three files below, any future updates added by the Drupal Association will be used in your
# pipelines automatically. However, you can modify this template if you have additional needs for your project.
# The full documentation is on https://project.pages.drupalcode.org/gitlab_templates/
################

# Step 1, 2 & 3: CI Configuration with JS_capable and Acceptance tests
# Implementing a step-by-step approach to get tests working

stages:
  - build
  - test

variables:
  # Reduce artifact size
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.composer-cache"
  # Avoid composer memory issues
  COMPOSER_MEMORY_LIMIT: -1
  # Avoid interactive prompts
  COMPOSER_NO_INTERACTION: "1"
  # Web root directory
  _WEB_ROOT: "web"
  # Reduce the size of the git clone
  GIT_DEPTH: "1"
  GIT_STRATEGY: "fetch"
  # Skip non-essential Drupal CI checks to simplify the initial pipeline
  SKIP_ESLINT: "1"
  SKIP_CSPELL: "1"
  SKIP_STYLELINT: "1"
  _SHOW_ENVIRONMENT_VARIABLES: "1"
  # Database configuration
  MYSQL_DATABASE: "db"
  MYSQL_ROOT_PASSWORD: "root"
  MYSQL_USER: "db"
  MYSQL_PASSWORD: "db"

# Cache composer dependencies to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .composer-cache/

build:
  stage: build
  image: drupalci/php-8.3-apache:production
  before_script:
    # Install required PHP extensions and dependencies
    - apt-get update -yqq
    - apt-get install -yqq git unzip libzip-dev libpng-dev libjpeg-dev libfreetype6-dev
    # Install Imagick extension
    - apt-get install -yqq libmagickwand-dev --no-install-recommends
    - pecl install imagick
    - docker-php-ext-enable imagick
    # Install other required extensions
    - docker-php-ext-install zip gd pdo_mysql
    # Install Composer
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    # Install project dependencies
    - composer install --no-progress --prefer-dist --optimize-autoloader
    # Remove unnecessary files to reduce artifact size
    - find . -name ".git" -type d -exec rm -rf {} +; true
    - find vendor -name "tests" -type d -exec rm -rf {} +; true
    - find vendor -name "Tests" -type d -exec rm -rf {} +; true
    - find vendor -name "test" -type d -exec rm -rf {} +; true
    - find vendor -name "docs" -type d -exec rm -rf {} +; true
    - find vendor -name "documentation" -type d -exec rm -rf {} +; true
    - find vendor -name "examples" -type d -exec rm -rf {} +; true
    # List directories to verify structure
    - ls -la
  artifacts:
    name: "${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}"
    paths:
      - vendor/
      - web/
      - recipes/
      - tests/
      - codeception.yml
      # Only include these directories if they exist
      - drush/
      - config/
    expire_in: 1 hour

js_capable_tests:
  stage: test
  # Use the specified Drupal CI image
  image: drupalci/php-8.3-apache:production
  services:
    - name: drupalci/mariadb-10.6:production
      alias: db
    - name: selenium/standalone-chrome:latest
      alias: selenium-chrome
  dependencies:
    - build
  before_script:
    # Install required PHP extensions and dependencies
    - apt-get update -yqq
    - apt-get install -yqq git unzip libzip-dev libpng-dev libjpeg-dev libfreetype6-dev
    # Install Imagick extension
    - apt-get install -yqq libmagickwand-dev --no-install-recommends
    - pecl install imagick
    - docker-php-ext-enable imagick
    # Install other required extensions
    - docker-php-ext-install zip gd pdo_mysql
    # Install additional dependencies for Codeception
    - apt-get install -yqq default-mysql-client
    # Configure Apache virtual host
    - echo "ServerName web" >> /etc/apache2/apache2.conf
    - a2enmod rewrite
    - echo '<VirtualHost *:80>
        ServerName web
        DocumentRoot /var/www/html/web
        <Directory /var/www/html/web>
            AllowOverride All
            Require all granted
        </Directory>
      </VirtualHost>' > /etc/apache2/sites-available/000-default.conf
    # Create symbolic link to web directory
    - ln -sf ${CI_PROJECT_DIR}/web /var/www/html/web
    - chown -R www-data:www-data ${CI_PROJECT_DIR}/web
    # Start Apache
    - service apache2 restart
    # Wait for services to be ready
    - sleep 10
    # List directories to verify structure
    - ls -la
    - ls -la tests/
  script:
    # Install Codeception
    - composer require codeception/codeception --dev
    - composer require codeception/module-webdriver --dev
    - composer require codeception/module-db --dev
    - composer require codeception/module-asserts --dev
    - composer require codeception/module-phpbrowser --dev
    # Create database dump if needed
    - echo "CREATE DATABASE IF NOT EXISTS db;" | mysql -h db -u root -p${MYSQL_ROOT_PASSWORD}
    # Run JS_capable tests
    - php vendor/bin/codecept run Js_capable --xml
  artifacts:
    when: always
    paths:
      - tests/_output/
    reports:
      junit: tests/_output/report.xml
    expire_in: 1 week

acceptance_tests:
  stage: test
  # Use the specified Drupal CI image
  image: drupalci/php-8.3-apache:production
  services:
    - name: drupalci/mariadb-10.6:production
      alias: db
  dependencies:
    - build
  before_script:
    # Install required PHP extensions and dependencies
    - apt-get update -yqq
    - apt-get install -yqq git unzip libzip-dev libpng-dev libjpeg-dev libfreetype6-dev
    # Install Imagick extension
    - apt-get install -yqq libmagickwand-dev --no-install-recommends
    - pecl install imagick
    - docker-php-ext-enable imagick
    # Install other required extensions
    - docker-php-ext-install zip gd pdo_mysql
    # Install additional dependencies for Codeception
    - apt-get install -yqq default-mysql-client
    # Configure Apache virtual host
    - echo "ServerName web" >> /etc/apache2/apache2.conf
    - a2enmod rewrite
    - echo '<VirtualHost *:80>
        ServerName web
        DocumentRoot /var/www/html/web
        <Directory /var/www/html/web>
            AllowOverride All
            Require all granted
        </Directory>
      </VirtualHost>' > /etc/apache2/sites-available/000-default.conf
    # Create symbolic link to web directory
    - ln -sf ${CI_PROJECT_DIR}/web /var/www/html/web
    - chown -R www-data:www-data ${CI_PROJECT_DIR}/web
    # Start Apache
    - service apache2 restart
    # Wait for services to be ready
    - sleep 10
    # List directories to verify structure
    - ls -la
    - ls -la tests/
  script:
    # Install Codeception
    - composer require codeception/codeception --dev
