# Step 1: Basic CI Configuration
# This is a simplified version to get the build working first

stages:
  - build

variables:
  # PHP and MariaDB versions
  PHP_VERSION: "8.3"
  MARIADB_VERSION: "10.11"
  # Reduce artifact size
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.composer-cache"
  # Avoid composer memory issues
  COMPOSER_MEMORY_LIMIT: -1
  # Avoid interactive prompts
  COMPOSER_NO_INTERACTION: "1"
  # Web root directory
  _WEB_ROOT: "web"
  # Reduce the size of the git clone
  GIT_DEPTH: "1"
  GIT_STRATEGY: "fetch"
  # Skip non-essential Drupal CI checks to simplify the initial pipeline
  SKIP_ESLINT: "1"
  SKIP_CSPELL: "1"
  SKIP_STYLELINT: "1"
  _SHOW_ENVIRONMENT_VARIABLES: "1"

# Cache composer dependencies to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .composer-cache/

build:
  stage: build
  image: php:${PHP_VERSION}-cli
  before_script:
    # Install required PHP extensions and dependencies
    - apt-get update -yqq
    - apt-get install -yqq git unzip libzip-dev libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-install zip gd pdo_mysql
    # Install Composer
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    # Install project dependencies
    - composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
    # Remove unnecessary files to reduce artifact size
    - find . -name ".git" -type d -exec rm -rf {} +; true
    - find vendor -name "tests" -type d -exec rm -rf {} +; true
    - find vendor -name "Tests" -type d -exec rm -rf {} +; true
    - find vendor -name "test" -type d -exec rm -rf {} +; true
    - find vendor -name "docs" -type d -exec rm -rf {} +; true
    - find vendor -name "documentation" -type d -exec rm -rf {} +; true
    - find vendor -name "examples" -type d -exec rm -rf {} +; true
  artifacts:
    name: "${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}"
    paths:
      - vendor/
      - web/
      - drush/
      - config/
      - recipes/
    exclude:
      - "**/.git/**"
      - "**/node_modules/**"
    expire_in: 1 hour
